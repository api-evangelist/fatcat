          filesets:
            type: array
            items:
              $ref: '#/definitions/entity_edit'
          webcaptures:
            type: array
            items:
              $ref: '#/definitions/entity_edit'
          releases:
            type: array
            items:
              $ref: '#/definitions/entity_edit'
          works:
            type: array
            items:
              $ref: '#/definitions/entity_edit'
