          '
      withdrawn_year:
        type: integer
        example: 2014
        format: int64
        description: 'Year corresponding with `withdrawn_date` like

          `release_year`/`release_date`.

          '
      ext_ids:
        $ref: '#/definitions/release_ext_ids'
        description: 'Set of external identifiers for this release.

          '
