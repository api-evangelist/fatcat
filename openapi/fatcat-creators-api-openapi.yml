          '
  release_contrib:
    type: object
    properties:
      index:
        type: integer
        format: int64
        example: 0
        description: 'Internally assigned zero-indexed sequence number of contribution.

          Authors should come first; this encodes the order of attriubtion.

          '
      creator_id:
        type: string
        pattern: '[a-zA-Z2-7]{26}'
        minLength: 26
        maxLength: 26
        description: 'If known, indicates the creator entity this contribution was made by.

          '
        example: q3nouwy3nnbsvo3h5klxsx4a7y
      creator:
        $ref: '#/definitions/creator_entity'
        description: 'Complete creator entity. Only returned in GET responses, and only if

          `contribs` included in the `expand` query parameter.

          '
      raw_name:
        type: string
        example: Jane K. Doe
        description: 'Full name of the contributor as typeset in the release.

          '
      given_name:
        type: string
        example: Jane
        description: 'In English commonly the first name, but ordering is context and

          culture specific.

          '
      surname:
        type: string
        example: Doe
        description: 'In English commonly the last, or family name, but ordering is context

          and culture specific.

          '
      role:
        type: string
        example: author
        description: 'Short string (slug) indicating type of contribution (eg, "author",

          "translator"). See guide for list of accpeted values.

          '
      raw_affiliation:
        type: string
        description: Raw affiliation string as displayed in text
      extra:
        type: object
        additionalProperties: {}
        description: 'Additional free-form JSON metadata about this

